name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @nexus/shared test
      - run: pnpm --filter @nexus/server test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-secret
          NEXT_PUBLIC_SERVER_WS_URL: ws://localhost:4000/ws
