name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          AUTH_SECRET: ci-secret-ci-secret
          NEXT_PUBLIC_SERVER_WS_URL: ws://localhost:4000/ws

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: nexus-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: nexus-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Images run as a non-root user
        run: |
          for image in nexus-server:ci nexus-web:ci; do
            uid=$(docker run --rm --entrypoint id "$image" -u)
            echo "$image runs as uid $uid"
            test "$uid" != 0
          done
      - name: Images boot
        run: |
          docker run -d --name server -p 4000:4000 \
            -e AUTH_SECRET=ci-secret-ci-secret -e LIVEKIT_URL=ws://localhost:7880 \
            -e LIVEKIT_API_KEY=devkey -e LIVEKIT_API_SECRET=devsecret-devsecret-devsecret-devsecret \
            nexus-server:ci
          docker run -d --name web -p 3000:3000 \
            -e AUTH_SECRET=ci-secret-ci-secret -e AUTH_URL=http://localhost:3000 \
            -e SERVER_WS_URL=ws://localhost:4000/ws \
            nexus-web:ci
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok" || { docker logs server; exit 1; }
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/login) || true
            [ "$code" != 000 ] && break
            sleep 2
          done
          echo "web /login answered $code"
          docker logs web
          [ "$code" != 000 ] && [ "$code" -lt 500 ]
      - name: Started as root with a root-owned volume (Railway), the server drops to node and owns its snapshot
        run: |
          docker volume create snapshot
          docker run --rm -u 0 -v snapshot:/data --entrypoint sh nexus-server:ci -c 'echo "{}" > /data/rooms.json'
          docker run -d --name server-root -u 0 -p 4001:4000 -v snapshot:/data \
            -e AUTH_SECRET=ci-secret-ci-secret -e LIVEKIT_URL=ws://localhost:7880 \
            -e LIVEKIT_API_KEY=devkey -e LIVEKIT_API_SECRET=devsecret-devsecret-devsecret-devsecret \
            -e ROOMS_SNAPSHOT_PATH=/data/rooms.json nexus-server:ci
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4001/health; then ok=1; break; fi
            sleep 2
          done
          test -n "$ok" || { docker logs server-root; exit 1; }
          user=$(docker exec server-root stat -c %U /proc/1)
          echo "server process runs as $user"
          test "$user" = node
          docker stop -t 10 server-root
          test "$(docker inspect -f '{{.State.ExitCode}}' server-root)" = 0
          owner=$(docker run --rm -v snapshot:/data --entrypoint stat nexus-server:ci -c '%U %a' /data/rooms.json)
          echo "snapshot: $owner"
          test "$owner" = "node 600"
          docker run --rm -v snapshot:/data --entrypoint sh nexus-server:ci -c 'grep -q "\"version\":1" /data/rooms.json'
      - name: Clean up
        if: always()
        run: docker rm -f server web server-root || true
